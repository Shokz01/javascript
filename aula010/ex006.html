<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area {
            font: normal 20pt arial;
            background-color: green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="area">
        Interaja...
    </div>

    <script>
        var a = window.document.getElementById('area')
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)
        a.addEventListener('mousedown', iniciou)
        a.addEventListener('mouseup', terminou)

        function clicar() {
            a.innerText = 'Clicou'
        }

        function entrar() {
            a.innerText = 'Entrou'
            a.style.backgroundColor = 'black'
        }

        function sair() {
            a.innerText = 'Saiu'
            a.style.backgroundColor = 'green'
        }

        function iniciou() {
            a.innerHTML = 'Iniciou o click'
            a.style.backgroundColor = 'red'
        }

        function terminou() {
            a.innerText = 'Terminou o click'
        }
    </script>
</body>
</html>
